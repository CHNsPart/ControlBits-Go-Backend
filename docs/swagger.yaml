basePath: /api/v1
definitions:
  dto.ArchiveHabitResponse:
    properties:
      message:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.ChangePasswordResponse:
    properties:
      message:
        type: string
    type: object
  dto.ConfirmPasswordResetRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  dto.ConfirmPasswordResetResponse:
    properties:
      message:
        type: string
    type: object
  dto.CreateHabitEntryRequest:
    properties:
      date:
        type: string
      note:
        type: string
      status:
        type: string
    required:
    - date
    - status
    type: object
  dto.CreateHabitEntryResponse:
    properties:
      id:
        type: string
      message:
        type: string
      new_badges:
        items:
          type: string
        type: array
    type: object
  dto.CreateHabitRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.CreateHabitResponse:
    properties:
      id:
        type: string
      message:
        type: string
    type: object
  dto.DeleteHabitEntryResponse:
    properties:
      message:
        type: string
    type: object
  dto.DeleteHabitResponse:
    properties:
      message:
        type: string
    type: object
  dto.GetHabitResponse:
    properties:
      archived:
        type: boolean
      created_at:
        type: string
      current_streak:
        type: integer
      description:
        type: string
      id:
        type: string
      longest_streak:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.HabitEntryResponse:
    properties:
      created_at:
        type: string
      entry_date:
        type: string
      habit_id:
        type: string
      id:
        type: string
      note:
        type: string
      status:
        type: string
    type: object
  dto.ListHabitEntriesResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/dto.HabitEntryResponse'
        type: array
    type: object
  dto.ListHabitsResponse:
    properties:
      habits:
        items:
          $ref: '#/definitions/dto.GetHabitResponse'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      message:
        type: string
      refresh_token:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.RegisterResponse:
    properties:
      message:
        type: string
    type: object
  dto.RequestPasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.RequestPasswordResetResponse:
    properties:
      message:
        type: string
      reset_token:
        type: string
    type: object
  dto.UpdateHabitRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  dto.UpdateHabitResponse:
    properties:
      message:
        type: string
    type: object
  handler.BadgeResponse:
    properties:
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      streak_required:
        type: integer
    type: object
  handler.CompleteHabitResponse:
    properties:
      message:
        type: string
      new_badges:
        items:
          $ref: '#/definitions/models.Badge'
        type: array
    type: object
  handler.DeleteUserResponse:
    properties:
      message:
        type: string
    type: object
  handler.EarnedBadgeResponse:
    properties:
      description:
        type: string
      earned_at:
        type: string
      habit_id:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      streak_required:
        type: integer
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.LogoutResponse:
    properties:
      message:
        type: string
    type: object
  handler.MissHabitResponse:
    properties:
      message:
        type: string
    type: object
  handler.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  handler.UpdateUserResponse:
    properties:
      message:
        type: string
    type: object
  handler.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Badge:
    properties:
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      streak_required:
        type: integer
    type: object
info:
  contact: {}
  description: Backend API for ControlBits habit tracking.
  title: ControlBits API
  version: 1.0.0
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RequestPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RequestPasswordResetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Request a password reset token
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login and receive access/refresh tokens
      tags:
      - Auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LogoutResponse'
      summary: Logout and invalidate refresh token
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Confirm password reset
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ConfirmPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ConfirmPasswordResetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Confirm password reset
      tags:
      - Auth
  /badges:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.BadgeResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all available badges
      tags:
      - Badges
  /habits:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListHabitsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List habits for current user
      tags:
      - Habits
    post:
      consumes:
      - application/json
      parameters:
      - description: Create habit request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateHabitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateHabitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new habit
      tags:
      - Habits
  /habits/{id}:
    delete:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeleteHabitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a habit by ID
      tags:
      - Habits
    get:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetHabitResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a habit by ID
      tags:
      - Habits
    put:
      consumes:
      - application/json
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      - description: Update habit request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateHabitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UpdateHabitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a habit by ID
      tags:
      - Habits
  /habits/{id}/archive:
    post:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArchiveHabitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Archive a habit
      tags:
      - Habits
  /habits/{id}/badges:
    get:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.EarnedBadgeResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List badges earned for a habit
      tags:
      - Badges
  /habits/{id}/complete:
    post:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompleteHabitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark a habit as completed today
      tags:
      - Entries
  /habits/{id}/entries:
    get:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListHabitEntriesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List habit entries
      tags:
      - Entries
    post:
      consumes:
      - application/json
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      - description: Create habit entry request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateHabitEntryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateHabitEntryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a habit entry for a specific date
      tags:
      - Entries
  /habits/{id}/entries/{entryId}:
    delete:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      - description: Entry ID
        in: path
        name: entryId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeleteHabitEntryResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a habit entry
      tags:
      - Entries
  /habits/{id}/miss:
    post:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MissHabitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark a habit as missed today
      tags:
      - Entries
  /habits/{id}/unarchive:
    post:
      parameters:
      - description: Habit ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArchiveHabitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unarchive a habit
      tags:
      - Habits
  /users/me:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.DeleteUserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete current user
      tags:
      - Users
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      parameters:
      - description: Update user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UpdateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Users
  /users/me/badges:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.EarnedBadgeResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List badges earned by current user
      tags:
      - Badges
  /users/me/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Change password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ChangePasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change current user password
      tags:
      - Users
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
